<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="keywords" content="Frontend Mentor, HTML, CSS, JavaScript" />
    <meta name="description" content="This is challenge from Frontend Mentor" />

    <meta name="author" content="Front End Mentor" />
    <meta name="developer" content="Khaled Mohamed" />

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />

    <title>Frontend Mentor | Contact form</title>

    <link rel="stylesheet" href="./dist/index.css" />

    <script type="module" src="./dist/index.bundle.js" defer></script>
</head>

<body>
    <header class="header" id="header">
        <h1 class="header__title sr-only">Contact Us</h1>
    </header>

    <main class="main-app" id="main-app">
        <section class="p-contact-us" id="contact-us">
            <header class="p-contact-us__header">
                <h2 class="p-contact-us__title">contact us</h2>
            </header>

            <div class="p-contact-us__content">
                <div class="p-contact-us__name-container u-d-flex u-dir-col u-min-md-row u-gap-1">
                    <div class="c-input is-column">
                        <div class="c-input__label-container">
                            <label for="first-name" class="c-input__label">first name</label>

                            <span class="u-star">*</span>
                        </div>

                        <div class="c-input__inner">
                            <input type="text" id="first-name" class="c-input__field" autocomplete="off" />
                        </div>
                    </div>

                    <div class="c-input is-column">
                        <div class="c-input__label-container">
                            <label for="last-name" class="c-input__label">last name</label>

                            <span class="u-star">*</span>
                        </div>

                        <div class="c-input__inner">
                            <input type="text" id="last-name" class="c-input__field" autocomplete="off" />
                        </div>
                    </div>
                </div>

                <div class="c-input is-column">
                    <div class="c-input__label-container">
                        <label for="email" class="c-input__label">email address</label>

                        <span class="u-star">*</span>
                    </div>

                    <div class="c-input__inner">
                        <input type="text" id="email" class="c-input__field" autocomplete="off" />
                    </div>
                </div>

                <div class="c-input is-column">
                    <div class="c-input__label-container">
                        <label for="email" class="c-input__label">email address</label>

                        <span class="u-star">*</span>
                    </div>

                    <div class="u-d-flex u-dir-col u-min-md-row u-gap-1">
                        <div class="c-radio u-w-100">
                            <label for="general-query" class="c-radio__container">
                                <input type="radio" class="c-radio__input" name="radios" value="0" id="general-query" />

                                <span class="c-radio__text">general query</span>
                            </label>
                        </div>

                        <div class="c-radio u-w-100">
                            <label for="support-request" class="c-radio__container">
                                <input type="radio" class="c-radio__input" name="radios" value="1" id="support-request" />

                                <span class="c-radio__text">support request</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="c-input is-column">
                    <div class="c-input__label-container">
                        <label for="message" class="c-input__label">Message</label>

                        <span class="u-star">*</span>
                    </div>

                    <div class="c-input__inner">
                        <textarea type="text" id="message" class="c-input__field is-textarea" autocomplete="off"></textarea>
                    </div>
                </div>

                <label for="checkbox" class="c-checkbox">
                    <input type="checkbox" id="checkbox" class="c-checkbox__input" />

                    <p class="c-checkbox__text">
                        I consent to being contacted by the team <span class="u-star">*</span>
                    </p>
                </label>

                <button type="button" class="c-button is-primary">submit</button>
            </div>
        </section>
    </main>
</body>

</html>
